name: generate animation

on:
  # Run automatically every 24 hours at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  
  # Allows manual triggering from Actions UI
  workflow_dispatch:
  
  # Run on pushes to main that modify this workflow
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"

concurrency:
  group: snake-animation
  cancel-in-progress: true

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Generates snake animation SVGs from user's GitHub contribution grid
      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push the SVGs to the 'output' branch
      - name: Push Animation SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish executive Step Summary to Actions run view
      - name: Contribution Snake Step Summary
        run: |
          echo "### 🐍 GitHub Contribution Snake Animation Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Branch:** \`output\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dark Asset:** [\`github-contribution-grid-snake-dark.svg\`](https://raw.githubusercontent.com/${{ github.repository }}/output/github-contribution-grid-snake-dark.svg)" >> $GITHUB_STEP_SUMMARY
          echo "- **Light Asset:** [\`github-contribution-grid-snake.svg\`](https://raw.githubusercontent.com/${{ github.repository }}/output/github-contribution-grid-snake.svg)" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Successfully rendered and pushed to \`output\` branch" >> $GITHUB_STEP_SUMMARY
