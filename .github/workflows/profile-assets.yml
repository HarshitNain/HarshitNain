name: refresh profile assets

# Regenerates the self-hosted dashboard SVGs (assets/*.svg) from live GitHub
# API data and commits any changes back to main.

on:
  schedule:
    - cron: "17 6 * * *"      # daily, 06:17 UTC
  workflow_dispatch:           # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - "assets/**"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Telemetry Cache
        uses: actions/cache@v4
        with:
          path: assets/.telemetry_cache.json
          key: telemetry-cache-${{ github.run_id }}
          restore-keys: |
            telemetry-cache-

      - name: Generate Dashboard SVGs & Telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 assets/generate.py

      - name: Validate SVG XML Well-Formedness
        run: |
          python3 -c "
          import glob, sys, xml.etree.ElementTree as ET
          svgs = sorted(glob.glob('assets/*.svg'))
          print(f'Checking {len(svgs)} SVG instruments for strict XML compliance...')
          failed = []
          for s in svgs:
              try:
                  ET.parse(s)
              except Exception as e:
                  failed.append((s, str(e)))
          if failed:
              print(f'❌ CRITICAL: {len(failed)} SVGs failed XML validation:', file=sys.stderr)
              for f, err in failed:
                  print(f'  - {f}: {err}', file=sys.stderr)
              sys.exit(1)
          print(f'✅ All {len(svgs)} SVG instruments passed XML parsing with zero errors.')
          "

      - name: Commit & Push Refreshed Assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if [ -f assets/.telemetry_cache.json ]; then
            git add assets/.telemetry_cache.json || true
          fi
          if [ -f preview.html ]; then
            cp preview.html index.html
            git add index.html || true
          fi
          if git diff --staged --quiet; then
            echo "No asset changes detected."
          else
            git commit -m "chore: refresh profile dashboard assets [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
